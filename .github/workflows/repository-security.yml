name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install publication scanner
        run: |
          python3 -m venv /tmp/repository-security-venv
          /tmp/repository-security-venv/bin/python -m pip install -r requirements-security.txt
      - name: Test security safeguards
        run: /tmp/repository-security-venv/bin/python -m unittest discover -s tests -p test_repository_security.py
      - name: Check public files
        run: /tmp/repository-security-venv/bin/python scripts/security/check_public_repository.py
