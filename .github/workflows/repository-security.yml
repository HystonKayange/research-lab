name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install publication scanner
        run: |
          python3 -m venv /tmp/repository-security-venv
          /tmp/repository-security-venv/bin/python -m pip install -r requirements-security.txt
      - name: Test security safeguards
        run: /tmp/repository-security-venv/bin/python -m unittest discover -s tests -p test_repository_security.py
      - name: Check public files
        run: /tmp/repository-security-venv/bin/python scripts/security/check_public_repository.py

  publication-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install presentation dependencies
        run: |
          python -m venv /tmp/publication-venv
          /tmp/publication-venv/bin/python -m pip install -r requirements-publication.txt
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
      - name: Test publication summaries
        run: /tmp/publication-venv/bin/python -m unittest discover -s tests -p test_publication_snapshot.py
      - name: Verify committed presentation artifacts
        run: /tmp/publication-venv/bin/python scripts/publication/check_publication_release.py
      - name: Rebuild from stored reports only
        run: |
          /tmp/publication-venv/bin/python scripts/publication/build_publication_snapshot.py
          /tmp/publication-venv/bin/python scripts/publication/build_paper_pdf.py
          /tmp/publication-venv/bin/python scripts/publication/check_publication_release.py --write-manifest
      - name: Check rebuilt presentation consistency
        run: /tmp/publication-venv/bin/python scripts/publication/check_publication_release.py
